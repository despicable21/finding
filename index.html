<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090B10" />
  <meta name="color-scheme" content="only dark" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Анкета</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <div class="shell">
    <header class="hud-header">
      <div class="hud-tags">
        <span id="loc-badge" class="hud-pill mono">LOC: DIRECT</span>
        <span id="demo-badge" class="hud-pill hud-pill--warn mono hidden">DEMO</span>
      </div>
    </header>

    <!-- Прогресс-бар для Блока 1 и Блока 2 -->
    <div id="progress-wrap" class="progress-wrap hidden" aria-hidden="true">
      <div class="progress-meta mono">
        <span id="progress-label">BLOCK 01 // STEP 01 / 09</span>
        <span id="progress-percent">11%</span>
      </div>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>

    <!-- Скрытое поле-ловушка против простых ботов -->
    <input
      type="text"
      id="honeypot"
      name="website"
      autocomplete="off"
      tabindex="-1"
      class="sr-only"
      aria-hidden="true"
    />

    <!-- Основная карточка экрана -->
    <main id="stage" class="hud-card" aria-live="polite"></main>

    <footer class="hud-footer mono">
      <span>ENCRYPTED // 1 ATTEMPT PER TG</span>
      <span id="footer-status">SYS: READY</span>
    </footer>
  </div>

  <script src="config.js"></script>
  <!-- Демо-вопросы (только для локального теста, в репозиторий не загружаются) -->
  <script src="demo-questions.js" onerror="void 0"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
